<!-- start custom head snippets -->

<!-- favicons (same set as the IROS 2026 Special Forum site) -->
<link rel="icon" href="{{ '/assets/images/favicon_tcrc_png.png' | relative_url }}" type="image/png">
<link rel="icon" href="{{ '/assets/images/favicon_tcrc.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon_tcrc.png' | relative_url }}">

<!-- Open Graph image size and X/Twitter card type (seo.html emits og:image itself) -->
{% if page.header.og_image or site.og_image %}
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{% endif %}
{% unless site.twitter.username %}
<meta name="twitter:card" content="summary_large_image">
{% endunless %}

<!-- end custom head snippets -->
